<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="NTUT AIoTFixer 即時排行榜。查看即時積分與排名。">
    <title>Circuit Fixer Leaderboard - NTUT AIoTFixer</title>
    
    <!-- 網站圖示 (Favicon) -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 448 512'%3E%3Cpath fill='%230ea5e9' d='M349.4 44.6c5.9-13.7 1.5-29.7-10.6-38.5s-28.6-8-39.9 1.8l-256 224c-10 8.8-13.6 22.9-8.9 35.3S50.7 288 64 288H175.5L98.6 467.4c-5.9 13.7-1.5 29.7 10.6 38.5s28.6 8 39.9-1.8l256-224c10-8.8 13.6-22.9 8.9-35.3s-16.6-20.7-30-20.7H272.5L349.4 44.6z'/%3E%3C/svg%3E" type="image/svg+xml">
    
    <!-- 載入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 載入科技感字體 -->
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <!-- Tailwind 自訂設定 -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { brand: { teal: '#14b8a6' } },
                    fontFamily: { mono: ['Share Tech Mono', 'monospace'] }
                }
            }
        }
    </script>
    
    <!-- 自訂 CSS：細緻滾動條，專為手機橫向滑動設計 -->
    <style>
        .custom-scrollbar::-webkit-scrollbar { height: 6px; width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.5); border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-2 sm:p-4 md:p-8 font-sans overflow-x-hidden selection:bg-brand-teal/30">
    <div class="max-w-5xl mx-auto w-full">
        
        <!-- ========================================== -->
        <!-- 1. 頂部標題與狀態列 (響應式排版)             -->
        <!-- ========================================== -->
        <header class="mb-4 md:mb-8 flex flex-col md:flex-row justify-between items-start md:items-end gap-3 md:gap-0 border-b border-slate-800 pb-3 md:pb-4 w-full">
            
            <!-- 左側：標題與語系切換 -->
            <div class="w-full md:w-auto flex justify-between items-center md:block">
                <div class="flex items-center gap-2 md:gap-3">
                    <h1 class="text-2xl sm:text-3xl md:text-5xl font-black text-brand-teal tracking-tight" data-i18n="title">電路維修員</h1>
                    <button onclick="toggleLanguage()" id="langBtn" class="bg-slate-800 text-slate-300 hover:text-white px-2 py-0.5 md:py-1 rounded text-[10px] md:text-xs border border-slate-700 transition-colors flex-shrink-0">EN</button>
                </div>
                <p class="text-slate-400 mt-1 md:mt-2 text-xs md:text-base hidden sm:block" data-i18n="subtitle">🏆 即時排行榜</p>
            </div>
            
            <!-- 右側：時間與同步狀態 (手機版改為橫向排列節省空間) -->
            <div class="w-full md:w-auto flex flex-row md:flex-col justify-between items-center md:items-end bg-slate-900 md:bg-transparent p-2 md:p-0 rounded-lg md:rounded-none border border-slate-800 md:border-none">
                <div class="text-[10px] md:text-xs text-slate-500 mb-0 md:mb-1 flex items-center gap-1.5 md:gap-2 justify-end">
                    <span id="syncStatus" class="w-1.5 h-1.5 md:w-2 md:h-2 bg-brand-teal rounded-full animate-pulse"></span>
                    <span data-i18n="syncText">即時同步中</span> <span class="hidden sm:inline">(每 1 秒更新)</span>
                </div>
                <div id="lastUpdate" class="text-brand-teal text-base sm:text-lg font-bold font-mono">00:00:00</div>
            </div>
        </header>

        <!-- ========================================== -->
        <!-- 2. 排行榜主表格 (防破版水平滾動設計)         -->
        <!-- ========================================== -->
        <div class="bg-slate-900 border border-slate-800 rounded-xl overflow-x-auto shadow-2xl custom-scrollbar w-full">
            <!-- 設定 min-w 避免在極端窄螢幕下文字擠壓 -->
            <table class="w-full text-left border-collapse min-w-[320px]">
                <thead>
                    <tr class="bg-slate-950 border-b border-slate-800 text-[11px] sm:text-xs md:text-sm">
                        <th class="py-2.5 md:py-4 px-3 md:px-6 font-bold text-slate-300 w-10 sm:w-16 md:w-24" data-i18n="thRank">排名</th>
                        <th class="py-2.5 md:py-4 px-3 md:px-6 font-bold text-slate-300" data-i18n="thName">維修員</th>
                        <th class="py-2.5 md:py-4 px-3 md:px-6 font-bold text-slate-300 text-right" data-i18n="thScore">總得分</th>
                        <th class="py-2.5 md:py-4 px-3 md:px-6 font-bold text-slate-300 text-center whitespace-nowrap" data-i18n="thLevel">抵達關卡</th>
                    </tr>
                </thead>
                <tbody id="leaderboard-body">
                    <!-- 資料由 JavaScript 動態生成注入此處 -->
                </tbody>
            </table>
        </div>
        
        <!-- ========================================== -->
        <!-- 3. 頁腳版權宣告                              -->
        <!-- ========================================== -->
        <div class="text-center mt-6 md:mt-8 text-slate-600 text-[10px] md:text-xs font-mono mb-4 md:mb-0">
            © <span id="current-year">2026</span> NTUT AIoTFixer. All Rights Reserved.
        </div>
    </div>

    <!-- ========================================== -->
    <!-- 4. JavaScript 核心邏輯區                   -->
    <!-- ========================================== -->
    <script>
        // --- 狀態變數 ---
        let lastData = []; // 儲存最後一次抓取的資料，供切換語言時重新渲染
        let currentLang = 'zh';

        // --- 雙語字典 (i18n) ---
        const i18n = {
            zh: {
                title: "電路維修員",
                subtitle: "🏆 即時排行榜",
                thRank: "排名",
                thName: "維修員",
                thScore: "總得分",
                thLevel: "關卡",
                syncText: "即時同步中",
                noRecord: "尚無維修紀錄，趕快成為第一位挑戰者吧！"
            },
            en: {
                title: "Circuit Fixer",
                subtitle: "🏆 Live Leaderboard",
                thRank: "Rank",
                thName: "Fixer",
                thScore: "Total Score",
                thLevel: "Level",
                syncText: "Live Syncing",
                noRecord: "No records yet. Be the first challenger!"
            }
        };

        // --- 語言切換邏輯 ---
        function toggleLanguage() {
            currentLang = currentLang === 'zh' ? 'en' : 'zh';
            document.getElementById('langBtn').innerText = currentLang === 'zh' ? 'EN' : 'ZH';
            applyLanguage();
            renderBoard(lastData); // 重新渲染以更新「尚無紀錄」的文字
        }

        function applyLanguage() {
            const elements = document.querySelectorAll('[data-i18n]');
            elements.forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (i18n[currentLang][key]) {
                    el.innerText = i18n[currentLang][key];
                }
            });
        }

        // --- XSS 防護：跳脫字元處理 ---
        function escapeHTML(str) {
            if (str == null) return '';
            return String(str).replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        // ==========================================
        // API 連線設定 (請替換為您的 GAS Web App URL)
        // ==========================================
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyniTBbW9ySb-UDCFFBVfeM9CE_PzlGu4TiarBnXwqTPH6SYjTsUSVpd-siFmq2iX3-/exec";

        // --- 抓取資料邏輯 ---
        function fetchLeaderboard() {
            // 情境 1：如果網頁被包裝在 GAS 內部運作 (使用 google.script.run)
            if (typeof google !== 'undefined' && google.script && google.script.run) {
                google.script.run
                    .withSuccessHandler(function(records) {
                        lastData = records;
                        renderBoard(records);
                        updateTime();
                    })
                    .withFailureHandler(function(error) {
                        console.error("GAS 抓取失敗:", error);
                    })
                    .getLeaderboardData();
            } 
            // 情境 2：外部部署 (GitHub Pages)，使用 fetch API
            else if (GAS_WEB_APP_URL && GAS_WEB_APP_URL !== "請在此填入您的_GAS_網址") {
                fetch(GAS_WEB_APP_URL)
                    .then(response => response.json())
                    .then(records => {
                        lastData = records;
                        renderBoard(records);
                        updateTime();
                    })
                    .catch(error => {
                        console.error("API 網路連線錯誤:", error);
                    });
            } 
            // 情境 3：本機開發測試，使用假資料
            else {
                const mockData = [
                    { name: '114310001', score: 15400, level: 6, timestamp: Date.now() - 10000 },
                    { name: '114310002', score: 12300, level: 5, timestamp: Date.now() - 20000 },
                    { name: '114310003', score: 9800, level: 4, timestamp: Date.now() - 30000 }
                ];
                lastData = mockData;
                renderBoard(mockData);
                updateTime();
            }
        }

        // --- 畫面渲染與動畫邏輯 ---
        function renderBoard(records) {
            const tbody = document.getElementById('leaderboard-body');
            
            // [FLIP 動畫階段 1：First] 記錄重新渲染前，所有資料列在畫面上的絕對位置 (Y 軸)
            const previousPositions = {};
            const currentRows = tbody.querySelectorAll('tr[data-key]');
            currentRows.forEach(row => {
                previousPositions[row.getAttribute('data-key')] = row.getBoundingClientRect().top;
            });

            // 清空舊資料
            tbody.innerHTML = '';

            // 處理無資料狀態
            if (!records || records.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="text-center py-6 md:py-8 text-slate-500 font-bold text-xs md:text-sm">${i18n[currentLang].noRecord}</td></tr>`;
                return;
            }

            // 建立新資料列 DOM
            records.forEach((record, index) => {
                const tr = document.createElement('tr');
                
                // 設定唯一 Key (姓名+分數+關卡+時間戳)，確保同分或同名時動畫引擎不會錯亂
                const key = `${record.name}_${record.score}_${record.level}_${record.timestamp || index}`; 
                tr.setAttribute('data-key', key);
                tr.className = "border-b border-slate-800/50 bg-slate-900 relative transition-colors hover:bg-slate-800/30";

                let rankHtml = `<span class="text-slate-400 font-mono text-xs md:text-base">${index + 1}</span>`;
                let nameClass = "text-slate-200";
                
                // 前三名動態樣式 (依據螢幕尺寸縮放徽章大小)
                if (index === 0) {
                    rankHtml = `<div class="bg-amber-500 text-slate-900 w-5 h-5 sm:w-6 sm:h-6 md:w-8 md:h-8 rounded-full flex items-center justify-center font-black shadow-[0_0_8px_rgba(245,158,11,0.5)] text-[10px] sm:text-xs md:text-base mx-auto md:mx-0">1</div>`;
                    nameClass = "text-amber-400 font-bold";
                } else if (index === 1) {
                    rankHtml = `<div class="bg-slate-300 text-slate-900 w-5 h-5 sm:w-6 sm:h-6 md:w-8 md:h-8 rounded-full flex items-center justify-center font-black shadow-[0_0_8px_rgba(203,213,225,0.5)] text-[10px] sm:text-xs md:text-base mx-auto md:mx-0">2</div>`;
                    nameClass = "text-slate-200 font-bold";
                } else if (index === 2) {
                    rankHtml = `<div class="bg-amber-700 text-slate-100 w-5 h-5 sm:w-6 sm:h-6 md:w-8 md:h-8 rounded-full flex items-center justify-center font-black shadow-[0_0_8px_rgba(180,83,9,0.5)] text-[10px] sm:text-xs md:text-base mx-auto md:mx-0">3</div>`;
                    nameClass = "text-amber-600 font-bold";
                }

                // 加入 truncate 防止惡意長檔名撐破表格
                tr.innerHTML = `
                    <td class="py-2.5 sm:py-3 md:py-4 px-2 sm:px-3 md:px-6 text-center md:text-left">${rankHtml}</td>
                    <td class="py-2.5 sm:py-3 md:py-4 px-2 sm:px-3 md:px-6 ${nameClass} text-xs sm:text-sm md:text-lg max-w-[90px] sm:max-w-[120px] md:max-w-[300px] truncate" title="${escapeHTML(record.name)}">${escapeHTML(record.name)}</td>
                    <td class="py-2.5 sm:py-3 md:py-4 px-2 sm:px-3 md:px-6 text-right font-mono text-sm sm:text-base md:text-xl font-bold text-brand-teal">${record.score.toLocaleString()}</td>
                    <td class="py-2.5 sm:py-3 md:py-4 px-2 sm:px-3 md:px-6 text-center">
                        <span class="bg-slate-800 text-slate-300 px-2 md:px-3 py-0.5 md:py-1 rounded-full text-[9px] md:text-sm font-mono border border-slate-700 whitespace-nowrap">Lv.${record.level}</span>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            // [FLIP 動畫階段 2 & 3：Last & Invert]
            const newRows = tbody.querySelectorAll('tr[data-key]');
            const tableRect = tbody.getBoundingClientRect();
            
            newRows.forEach(row => {
                const key = row.getAttribute('data-key');
                const newTop = row.getBoundingClientRect().top; // Last: 取得 DOM 渲染後的新位置
                
                let oldTop = previousPositions[key];
                let isNew = false;
                
                // 處理新進榜的資料：讓它從表格底部飛入
                if (oldTop === undefined) {
                    oldTop = tableRect.bottom + 50;
                    isNew = true;
                    row.style.zIndex = "20"; // 置頂，防止被向下掉的列遮擋
                } else {
                    row.style.zIndex = "10";
                }
                
                const deltaY = oldTop - newTop;
                
                // Invert: 取消 CSS 過渡，瞬間用 transform 把元素移回「上一次的位置」
                row.style.transform = `translateY(${deltaY}px)`;
                row.style.transition = 'none';
                if (isNew) {
                    row.style.opacity = '0';
                }
            });

            // 強制瀏覽器重繪 (Reflow)，讓剛才的 Invert 生效
            document.body.offsetHeight; 

            // [FLIP 動畫階段 4：Play]
            newRows.forEach(row => {
                // 移除 transform，並開啟過渡動畫，讓元素平滑移動到真正的「新位置」
                row.style.transform = 'translateY(0)';
                row.style.transition = 'transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.6s ease-out';
                row.style.opacity = '1';
            });
        }

        // --- 狀態列時鐘更新 ---
        function updateTime() {
            const now = new Date();
            const format = (num) => num.toString().padStart(2, '0');
            const timeStr = `${format(now.getHours())}:${format(now.getMinutes())}:${format(now.getSeconds())}`;
            document.getElementById('lastUpdate').innerText = timeStr;
        }

        // --- 系統初始化 ---
        applyLanguage();
        document.getElementById('current-year').textContent = new Date().getFullYear();
        
        // 啟動排程：每秒抓取一次最新資料
        fetchLeaderboard();
        setInterval(fetchLeaderboard, 1000);
        
        // 啟動排程：每秒更新右上角時鐘
        setInterval(updateTime, 1000);
    </script>
</body>
</html>
