<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="NTUT AIoTFixer - 電路維修員。體驗電路旋轉與修復邏輯，挑戰最高連擊與分數！">
    <title>Circuit Fixer - NTUT AIoTFixer</title>
    
    <!-- 引入外部資源 (Tailwind, 字體, 圖示, 紙花套件) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 448 512'%3E%3Cpath fill='%230ea5e9' d='M349.4 44.6c5.9-13.7 1.5-29.7-10.6-38.5s-28.6-8-39.9 1.8l-256 224c-10 8.8-13.6 22.9-8.9 35.3S50.7 288 64 288H175.5L98.6 467.4c-5.9 13.7-1.5 29.7 10.6 38.5s28.6 8 39.9-1.8l256-224c10-8.8 13.6-22.9 8.9-35.3s-16.6-20.7-30-20.7H272.5L349.4 44.6z'/%3E%3C/svg%3E" type="image/svg+xml">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cyber: { dark: '#050b14', panel: '#0f172a', line: '#334155', glow: '#0ea5e9', success: '#10b981', danger: '#ef4444' }
                    },
                    fontFamily: { mono: ['Share Tech Mono', 'monospace'] }
                }
            }
        }
    </script>
    <style>
        /* 鎖定手機畫面防滑動，避免遊戲過程中誤觸滑動 */
        body { overscroll-behavior-y: none; touch-action: none; }
        
        /* 霓虹發光特效，用於通電與成功狀態 */
        .neon-glow { filter: drop-shadow(0 0 8px #0ea5e9) drop-shadow(0 0 12px #0ea5e9); }
        .neon-success { filter: drop-shadow(0 0 10px #10b981) drop-shadow(0 0 15px #10b981); }
        .neon-text { text-shadow: 0 0 8px rgba(14, 165, 233, 0.8); }
        
        /* SVG 內部線條共用樣式與狀態變換 */
        .wire-base { fill: none; stroke-linecap: round; stroke-linejoin: round; transition: all 0.3s ease; }
        .wire-off { stroke: #334155; }
        .wire-on { stroke: #0ea5e9; }
        .wire-finish { stroke: #10b981; }
        
        /* 方塊旋轉動畫，增加物理彈跳感 */
        .tile { transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1); }

        /* 浮動加分動畫，過關時彈出 */
        @keyframes floatUp {
            0% { opacity: 0; transform: translate(-50%, 0) scale(0.5); }
            20% { opacity: 1; transform: translate(-50%, -20px) scale(1.2); }
            80% { opacity: 1; transform: translate(-50%, -60px) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -80px) scale(0.8); }
        }
        .animate-float-up { animation: floatUp 1.2s ease-out forwards; }
        
        /* 自訂滾動條 (排行榜用) */
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.5); }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    </style>
</head>
<body class="bg-cyber-dark text-white h-screen w-screen overflow-hidden flex flex-col font-mono select-none overscroll-none">

    <!-- 全域提示訊息框 (Toast) -->
    <div id="game-toast" class="fixed top-20 left-1/2 transform -translate-x-1/2 bg-slate-800 text-white px-6 py-3 rounded-full shadow-2xl border border-slate-600 z-[100] transition-all duration-300 opacity-0 translate-y-[-20px] pointer-events-none">
        提示訊息
    </div>

    <!-- 頂部資訊列 (包含標題、語系切換、計分板) -->
    <header class="flex-none bg-cyber-panel border-b border-cyan-900/50 p-2 md:p-4 flex justify-between items-center z-10 shadow-lg shadow-cyan-900/20 relative gap-1">
        <div class="flex items-center gap-1.5 md:gap-3 min-w-0 flex-1">
            <div class="bg-cyan-500/20 text-cyan-400 p-1.5 md:p-2 rounded flex items-center justify-center border border-cyan-500/30 flex-shrink-0">
                <i class="fa-solid fa-bolt text-base md:text-xl"></i>
            </div>
            <!-- 左側標題與按鈕區 (使用 flex-nowrap 與 flex-1 確保在極端小螢幕下不破版) -->
            <div class="flex items-center gap-1.5 md:gap-2 flex-nowrap min-w-0 flex-1">
                <h1 class="font-bold text-[13px] sm:text-sm md:text-lg text-cyan-400 tracking-wider neon-text leading-tight truncate min-w-[40px]" data-i18n="headerTitle">電路維修員</h1>
                <button onclick="toggleLanguage()" id="langBtn" class="bg-slate-800 text-slate-300 hover:text-white px-1.5 py-0.5 rounded text-[9px] md:text-xs border border-slate-700 transition-colors flex-shrink-0">EN</button>
                <button onclick="openLeaderboardModal()" class="bg-amber-600/20 hover:bg-amber-600/40 text-amber-400 px-2 py-0.5 rounded text-[9px] md:text-xs border border-amber-500/40 transition-colors flex items-center gap-1 flex-shrink-0">
                    <i class="fa-solid fa-trophy"></i> 
                    <span data-i18n="headerLeaderboard" class="hidden min-[375px]:inline">排行榜</span>
                </button>
            </div>
        </div>

        <!-- 右側狀態列 (等級、分數、倒數時間) -->
        <div class="flex items-center gap-1.5 sm:gap-3 md:gap-8 flex-shrink-0">
            <div class="text-center">
                <div class="text-[9px] md:text-[10px] text-slate-500 uppercase tracking-widest hidden sm:block">LEVEL</div>
                <div class="text-base sm:text-lg md:text-2xl font-bold text-white"><i class="fa-solid fa-layer-group text-slate-500 text-[10px] sm:hidden mr-1"></i><span id="ui-level">1</span></div>
            </div>
            <div class="text-center">
                <div class="text-[9px] md:text-[10px] text-slate-500 uppercase tracking-widest hidden sm:block">SCORE</div>
                <div class="text-base sm:text-lg md:text-2xl font-bold text-emerald-400"><i class="fa-solid fa-star text-emerald-700 text-[10px] sm:hidden mr-1"></i><span id="ui-score">0</span></div>
            </div>
            <div class="text-center bg-slate-900 px-1.5 py-1 md:px-3 md:py-1 rounded border border-slate-700">
                <div class="text-[9px] md:text-[10px] text-slate-500 uppercase tracking-widest hidden sm:block">TIMER</div>
                <div class="text-base sm:text-lg md:text-2xl font-bold text-rose-400 min-w-[45px] sm:min-w-[55px] md:min-w-[70px] tabular-nums whitespace-nowrap"><i class="fa-regular fa-clock text-rose-800 text-[10px] sm:hidden mr-0.5"></i><span id="ui-timer">60</span></div>
            </div>
        </div>
    </header>

    <!-- 遊戲主要操作區域 -->
    <main class="flex-grow relative flex items-center justify-center p-2 md:p-6 overflow-hidden">
        
        <!-- 核心電路板與兩側終端容器 (使用 items-center 防止上下背景過度拉伸) -->
        <div class="w-full max-w-5xl flex items-center justify-center gap-1 sm:gap-2 md:gap-4 h-full max-h-[800px] relative">
            
            <!-- 左側：電源起點 -->
            <div class="flex flex-col justify-center items-end relative w-12 sm:w-16 md:w-28 flex-shrink-0">
                <div class="absolute left-1/2 top-1/2 -translate-y-1/2 w-[200%] h-[10px] sm:h-[14px] md:h-[22px] bg-cyan-500 z-0 pointer-events-none"></div>
                <div class="bg-cyber-panel border sm:border-2 border-cyan-800 rounded-md sm:rounded-lg p-1 sm:p-2 text-center w-full relative z-10 shadow-lg flex flex-col items-center">
                    <i class="fa-solid fa-plug text-cyan-500 text-xl sm:text-2xl md:text-4xl mb-0.5 md:mb-2"></i>
                    <div class="text-[8px] sm:text-[10px] md:text-xs font-bold text-cyan-400 leading-tight">110V<br>AC</div>
                </div>
            </div>

            <!-- 中央：動態解謎網格 (使用 h-fit 與 aspect-square 緊緊包覆網格，不超出螢幕) -->
            <div class="w-full max-w-[450px] sm:max-w-[500px] lg:max-w-[600px] flex items-center justify-center p-1.5 md:p-2 bg-cyber-panel/50 rounded-xl border border-slate-800 relative z-20 shadow-2xl backdrop-blur-md h-fit aspect-square">
                <!-- 網格容器 -->
                <div id="gameBoard" class="grid gap-1 md:gap-1.5 w-full aspect-square relative bg-slate-950 p-1.5 sm:p-2 md:p-3 rounded-lg" style="grid-template-columns: repeat(5, minmax(0, 1fr));">
                    <!-- 方塊 (Tiles) 將由 JS 動態塞入 -->
                </div>
            </div>

            <!-- 右側：待修復家電終點 -->
            <div class="flex flex-col justify-center items-start relative w-12 sm:w-16 md:w-28 flex-shrink-0">
                <div id="endLine" class="absolute right-1/2 top-1/2 -translate-y-1/2 w-[200%] h-[10px] sm:h-[14px] md:h-[22px] bg-cyber-line z-0 pointer-events-none transition-colors duration-300"></div>
                <div id="applianceBox" class="bg-cyber-panel border sm:border-2 border-slate-700 rounded-md sm:rounded-lg p-1 sm:p-2 text-center w-full relative z-10 transition-all duration-300 flex flex-col items-center shadow-lg">
                    <i id="applianceIcon" class="fa-solid fa-fan text-slate-500 text-xl sm:text-2xl md:text-4xl mb-0.5 md:mb-2 transition-colors duration-300"></i>
                    <div id="applianceText" class="text-[8px] sm:text-[10px] md:text-xs font-bold text-slate-500 leading-tight transition-colors duration-300">DC FAN<br>OFF</div>
                </div>
            </div>
            
        </div>

        <!-- 遊戲開始畫面 Overlay -->
        <div id="overlay-start" class="absolute inset-0 bg-cyber-dark/90 backdrop-blur-sm flex flex-col items-center justify-center z-50">
            <i class="fa-solid fa-triangle-exclamation text-rose-500 text-6xl mb-4 neon-text"></i>
            <h2 class="text-3xl md:text-5xl font-bold text-white mb-2 tracking-tight" data-i18n="startTitle">電路維修員</h2>
            <p class="text-slate-400 text-sm md:text-base mb-8 text-center max-w-sm px-4" data-i18n="startDesc">點擊方塊旋轉電線，將左側電源接通至右側家電。<br>隨著關卡推進，電路板將擴展至最大 9x9！</p>
            <button onclick="startGame()" class="bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-3 px-10 rounded-full text-lg shadow-[0_0_15px_rgba(14,165,233,0.5)] transition-all transform hover:scale-105" data-i18n="startBtn">
                開始搶修
            </button>
        </div>

        <!-- 遊戲結束與結算畫面 Overlay (加入 overflow-y-auto 與 padding 避免在極小手機被切斷) -->
        <div id="overlay-gameover" class="absolute inset-0 bg-cyber-dark/95 backdrop-blur-md flex flex-col items-center justify-center z-50 hidden overflow-y-auto px-4 py-4">
            <div class="flex flex-col items-center justify-center w-full min-h-max my-auto py-6">
                <h2 class="text-4xl md:text-6xl font-bold text-rose-500 mb-1 md:mb-2">TIME'S UP</h2>
                <p class="text-slate-300 text-sm md:text-lg mb-4" data-i18n="gameOverDesc">搶修時間結束！</p>
                
                <!-- 結算成績版面 -->
                <div class="bg-cyber-panel border border-slate-700 p-4 md:p-6 rounded-xl text-center mb-4 w-full max-w-[260px] shadow-2xl flex-shrink-0">
                    <div class="text-xs md:text-sm text-slate-500 mb-1" data-i18n="finalScore">總得分</div>
                    <div class="text-4xl md:text-5xl font-bold text-emerald-400 drop-shadow-[0_0_10px_rgba(16,185,129,0.5)]" id="final-score">0</div>
                    <div class="text-xs md:text-sm text-slate-500 mt-3 md:mt-4 mb-1" data-i18n="finalLevel">抵達關卡</div>
                    <div class="text-xl md:text-2xl font-bold text-cyan-400" id="final-level">1</div>
                </div>

                <!-- 分數上傳表單 -->
                <div class="w-full max-w-[260px] mb-6 space-y-2 md:space-y-3 flex-shrink-0">
                    <input type="text" id="playerName" placeholder="輸入學號" data-i18n-placeholder="namePlaceholder" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 md:p-3 text-white text-center focus:outline-none focus:border-cyan-500 transition-colors text-sm" maxlength="12">
                    <button id="btn-submit-score" onclick="submitScore()" class="w-full bg-amber-600 hover:bg-amber-500 text-white font-bold py-2.5 md:py-3 rounded-lg text-sm shadow-[0_0_15px_rgba(217,119,6,0.5)] transition-all" data-i18n="submitBtn">
                        送出成績
                    </button>
                </div>

                <button onclick="initGame()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 md:py-3 px-8 md:px-10 rounded-full text-base md:text-lg shadow-[0_0_15px_rgba(16,185,129,0.5)] transition-all transform hover:scale-105 flex-shrink-0" data-i18n="retryBtn">
                    重新挑戰
                </button>
            </div>
        </div>
        
        <!-- 遊戲內嵌排行榜彈出視窗 (Modal) -->
        <div id="overlay-leaderboard" class="absolute inset-0 bg-cyber-dark/95 backdrop-blur-md flex flex-col items-center justify-center z-50 hidden p-4">
            <!-- 限制高度 max-h-[85vh] 確保在任何手機上都不會超出螢幕 -->
            <div class="w-full max-w-2xl bg-cyber-panel border border-slate-700 rounded-2xl flex flex-col max-h-[85vh] h-[600px] shadow-2xl overflow-hidden">
                <!-- 排行榜視窗頂部標題與關閉鈕 -->
                <div class="p-4 border-b border-slate-800 flex justify-between items-center bg-slate-950 flex-shrink-0">
                    <div class="flex items-center gap-2">
                        <i class="fa-solid fa-trophy text-amber-400"></i>
                        <h3 class="font-bold text-lg text-white" data-i18n="modalLeaderboardTitle">即時排行榜 (Top 100)</h3>
                    </div>
                    <button onclick="closeLeaderboardModal()" class="text-slate-400 hover:text-white p-2 transition-colors">
                        <i class="fa-solid fa-xmark text-xl"></i>
                    </button>
                </div>
                <!-- 排行榜表格主體 (可滾動) -->
                <div class="flex-grow overflow-y-auto custom-scrollbar p-2 md:p-4">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="text-[10px] md:text-xs text-slate-500 border-b border-slate-800 uppercase">
                                <th class="py-2 px-2 md:px-3 w-12" data-i18n="thRank">排名</th>
                                <th class="py-2 px-2 md:px-3" data-i18n="thFixer">維修員</th>
                                <th class="py-2 px-2 md:px-3 text-right" data-i18n="thScore">總得分</th>
                                <th class="py-2 px-2 md:px-3 text-center w-16" data-i18n="thLevel">關卡</th>
                            </tr>
                        </thead>
                        <tbody id="modal-leaderboard-body">
                            <!-- 排名資料動態注入 -->
                        </tbody>
                    </table>
                </div>
                <!-- 排行榜視窗底部狀態與重整列 -->
                <div class="p-3 border-t border-slate-800 bg-slate-950 flex justify-between items-center px-4 flex-shrink-0">
                    <div class="text-[10px] text-slate-500 flex items-center gap-1.5 font-mono" id="modal-sync-status"></div>
                    <button onclick="fetchModalLeaderboard(true)" id="btn-refresh-board" class="text-cyan-400 hover:text-white text-xs flex items-center gap-1.5 disabled:opacity-50 transition-colors">
                        <i id="icon-refresh" class="fa-solid fa-rotate-right"></i> <span data-i18n="refresh">重新整理</span>
                    </button>
                </div>
            </div>
        </div>
    </main>
    
    <!-- 頁腳版權宣告 (z-40 防止遮擋彈出視窗按鈕) -->
    <div class="fixed bottom-1 right-2 text-[8px] md:text-[10px] text-slate-500/50 font-mono pointer-events-none z-40 select-none">
        © <span id="current-year">2026</span> NTUT AIoTFixer. All Rights Reserved.
    </div>

    <script>
        // ==========================================
        // 1. 全域常數與狀態變數設定區
        // ==========================================
        
        // 方向定義 (用於判斷管線接點)
        const DIR_TOP = 0, DIR_RIGHT = 1, DIR_BOTTOM = 2, DIR_LEFT = 3;

        // 方塊類型定義
        const TILE_STRAIGHT = 1; // 直線
        const TILE_CORNER = 2;   // 轉角 (L)
        const TILE_T_SHAPE = 3;  // T字
        const TILE_CROSS = 4;    // 十字

        // 目標家電資料庫
        const appliances = [
            { icon: 'fa-fan', name: 'DC FAN' },
            { icon: 'fa-lightbulb', name: 'LAMP' },
            { icon: 'fa-tv', name: 'TV' },
            { icon: 'fa-blender', name: 'BLENDER' },
            { icon: 'fa-fire-burner', name: 'COOKER' }
        ];

        // 遊戲核心狀態變數
        let board = [];
        let currentGridSize = 5;
        let startRow = 2, startCol = 0, endRow = 2, endCol = 4;
        let currentAppliance = appliances[0];
        
        let level = 1;
        let score = 0;
        let timeLeft = 60;
        let timerInterval;
        
        // 控制鎖定狀態
        let isPlaying = false;      // 遊戲進行中 (用來控制計時與點擊)
        let isAnimating = false;    // 過關動畫中 (防連點)
        let levelClicks = 0;        // 點擊次數 (結算加分)
        let levelStartTime = 0;

        const boardEl = document.getElementById('gameBoard');

        // SVG 圖形資源預設版型 (使用 {{STATE_CLASS}} 動態替換顏色)
        const SVG_STRAIGHT = `<svg viewBox="0 0 100 100" class="w-full h-full"><line x1="50" y1="0" x2="50" y2="100" class="wire-base {{STATE_CLASS}}" stroke-width="24"/></svg>`;
        const SVG_CORNER = `<svg viewBox="0 0 100 100" class="w-full h-full"><path d="M 50 0 L 50 50 L 100 50" class="wire-base {{STATE_CLASS}}" stroke-width="24"/></svg>`;
        const SVG_T_SHAPE = `<svg viewBox="0 0 100 100" class="w-full h-full"><path d="M 50 0 L 50 100 M 50 50 L 100 50" class="wire-base {{STATE_CLASS}}" stroke-width="24"/></svg>`;
        const SVG_CROSS = `<svg viewBox="0 0 100 100" class="w-full h-full"><path d="M 50 0 L 50 100 M 0 50 L 100 50" class="wire-base {{STATE_CLASS}}" stroke-width="24"/></svg>`;

        // ==========================================
        // 2. 防呆與全域功能函式
        // ==========================================
        
        // 核心跳脫字元函數 (防止 XSS 攻擊，確保渲染排行榜時的安全)
        function escapeHTML(str) {
            if (str == null) return '';
            return String(str).replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        // 自訂浮動提示框
        function alertCustom(msg) {
            const toast = document.getElementById('game-toast');
            toast.innerText = msg;
            toast.classList.remove('opacity-0', 'translate-y-[-20px]');
            toast.classList.add('opacity-100', 'translate-y-0');
            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'translate-y-[-20px]');
            }, 3000);
        }

        // ==========================================
        // 3. 雙語化 (i18n) 系統
        // ==========================================
        let currentLang = 'zh';
        const i18n = {
            zh: {
                headerTitle: "電路維修員",
                headerLeaderboard: "排行榜",
                startTitle: "電路維修員",
                startDesc: "點擊方塊旋轉電線，將左側電源接通至右側家電。<br>隨著關卡推進，電路板將擴展至最大 9x9！",
                startBtn: "開始搶修",
                gameOverDesc: "搶修時間結束！",
                finalScore: "總得分",
                finalLevel: "抵達關卡",
                namePlaceholder: "輸入學號",
                submitBtn: "送出成績",
                retryBtn: "重新挑戰",
                toastSuccess: "成績已上傳至排行榜！",
                toastFail: "網路連線不穩，成績上傳失敗",
                toastTest: "尚未設定 GAS 網址，已完成本機測試",
                btnSubmitting: "上傳中...",
                btnSubmitted: "已上傳",
                btnTestDone: "測試完成",
                modalLeaderboardTitle: "即時排行榜 (Top 100)",
                thRank: "排名",
                thFixer: "維修員",
                thScore: "總得分",
                thLevel: "關卡",
                loading: "載入中...",
                connectError: "無法連線至排行榜",
                refresh: "重新整理",
                syncing: "同步中...",
                updated: "已更新"
            },
            en: {
                headerTitle: "Circuit Fixer",
                headerLeaderboard: "Leaderboard",
                startTitle: "Circuit Fixer",
                startDesc: "Tap the tiles to rotate wires and connect power to the appliance.<br>The board expands up to 9x9!",
                startBtn: "START REPAIR",
                gameOverDesc: "Repair time is over!",
                finalScore: "Total Score",
                finalLevel: "Level Reached",
                namePlaceholder: "Enter Student ID",
                submitBtn: "Submit Score",
                retryBtn: "Try Again",
                toastSuccess: "Score uploaded to leaderboard!",
                toastFail: "Connection unstable, upload failed.",
                toastTest: "GAS URL not set, test mode only.",
                btnSubmitting: "Submitting...",
                btnSubmitted: "Submitted",
                btnTestDone: "Test Done",
                modalLeaderboardTitle: "Live Leaderboard (Top 100)",
                thRank: "Rank",
                thFixer: "Fixer",
                thScore: "Total Score",
                thLevel: "Level",
                loading: "Loading...",
                connectError: "Unable to connect to leaderboard",
                refresh: "Refresh",
                syncing: "Syncing...",
                updated: "Updated"
            }
        };

        function toggleLanguage() {
            currentLang = currentLang === 'zh' ? 'en' : 'zh';
            document.getElementById('langBtn').innerText = currentLang === 'zh' ? 'EN' : 'ZH';
            document.title = currentLang === 'zh' ? "電路維修員 - NTUT AIoTFixer" : "Circuit Fixer - NTUT AIoTFixer";
            applyLanguage();
            
            // 若排行榜正開著，順便重新渲染文字
            const modal = document.getElementById('overlay-leaderboard');
            if (modal && !modal.classList.contains('hidden') && cachedLeaderboardData) {
                renderModalBoard(cachedLeaderboardData); 
            }
        }

        function applyLanguage() {
            const elements = document.querySelectorAll('[data-i18n]');
            elements.forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (i18n[currentLang][key]) el.innerHTML = i18n[currentLang][key];
            });

            const placeholders = document.querySelectorAll('[data-i18n-placeholder]');
            placeholders.forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if (i18n[currentLang][key]) el.setAttribute('placeholder', i18n[currentLang][key]);
            });
            
            const submitBtn = document.getElementById('btn-submit-score');
            if (submitBtn && !submitBtn.disabled) {
                submitBtn.innerText = i18n[currentLang].submitBtn;
            }
        }

        // ==========================================
        // 4. 遊戲流程控制 (Start, Reset, Timer)
        // ==========================================
        
        function initGame() {
            level = 1;
            score = 0;
            timeLeft = 60;
            updateUI();
            
            const submitBtn = document.getElementById('btn-submit-score');
            if(submitBtn) {
                submitBtn.innerText = i18n[currentLang].submitBtn;
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-75');
            }
            
            document.getElementById('overlay-gameover').classList.add('hidden');
            document.getElementById('overlay-start').classList.remove('hidden');
            clearInterval(timerInterval);
        }

        function startGame() {
            document.getElementById('overlay-start').classList.add('hidden');
            isPlaying = true;
            nextLevel();
            
            timerInterval = setInterval(() => {
                // 如果 isPlaying 被設為 false (如：打開排行榜)，則直接返回不扣秒
                if (!isPlaying) return; 
                timeLeft--;
                updateUI();
                if (timeLeft <= 0) gameOver();
            }, 1000);
        }

        function gameOver() {
            isPlaying = false;
            clearInterval(timerInterval);
            document.getElementById('final-score').textContent = score;
            document.getElementById('final-level').textContent = level;
            document.getElementById('overlay-gameover').classList.remove('hidden');
        }

        function updateUI() {
            document.getElementById('ui-level').textContent = level;
            document.getElementById('ui-score').textContent = score;
            document.getElementById('ui-timer').textContent = timeLeft;
        }

        // ==========================================
        // 5. 關卡生成與解謎邏輯
        // ==========================================
        
        function nextLevel() {
            isAnimating = true; 
            levelClicks = 0;
            levelStartTime = Date.now();
            
            currentAppliance = appliances[Math.floor(Math.random() * appliances.length)];
            resetApplianceUI();

            // 根據關卡數調整網格難度
            if (level <= 2) currentGridSize = 5;
            else if (level <= 5) currentGridSize = 7;
            else currentGridSize = 9;

            startRow = Math.floor(currentGridSize / 2); startCol = 0;
            endRow = Math.floor(currentGridSize / 2); endCol = currentGridSize - 1;

            boardEl.style.gridTemplateColumns = `repeat(${currentGridSize}, minmax(0, 1fr))`;
            board = Array(currentGridSize).fill(null).map(() => Array(currentGridSize).fill(null));
            
            // 核心 1：DFS 產生保證有解的正解路徑
            let path = generateRandomPath(currentGridSize, startRow, startCol, endRow, endCol);

            // 核心 2：配置正確路徑上的方塊
            for (let i = 0; i < path.length; i++) {
                let curr = path[i];
                let prev = i > 0 ? path[i-1] : {r: startRow, c: startCol - 1};
                let next = i < path.length - 1 ? path[i+1] : {r: endRow, c: endCol + 1};

                let dr1 = curr.r - prev.r, dc1 = curr.c - prev.c;
                let dr2 = next.r - curr.r, dc2 = next.c - curr.c;

                let inDir = (dr1 === -1) ? DIR_BOTTOM : (dr1 === 1) ? DIR_TOP : (dc1 === -1) ? DIR_RIGHT : DIR_LEFT;
                let outDir = (dr2 === -1) ? DIR_TOP : (dr2 === 1) ? DIR_BOTTOM : (dc2 === -1) ? DIR_LEFT : DIR_RIGHT;

                let typeOptions = [];
                if (inDir === (outDir + 2) % 4) typeOptions = [TILE_STRAIGHT, TILE_CROSS, TILE_T_SHAPE];
                else typeOptions = [TILE_CORNER, TILE_T_SHAPE, TILE_CROSS];

                let type = typeOptions[0]; 
                if (level > 2 && Math.random() > 0.75) type = typeOptions[Math.floor(Math.random() * typeOptions.length)];

                board[curr.r][curr.c] = { type: type, rot: Math.floor(Math.random() * 4), isPowered: false, isPath: true };
            }

            // 核心 3：填補剩下的干擾方塊
            for (let r = 0; r < currentGridSize; r++) {
                for (let c = 0; c < currentGridSize; c++) {
                    if (!board[r][c]) {
                        let rand = Math.random();
                        let fType = TILE_CORNER;
                        if (rand > 0.95) fType = TILE_CROSS;         
                        else if (rand > 0.85) fType = TILE_T_SHAPE;  
                        else if (rand > 0.45) fType = TILE_STRAIGHT; 
                        board[r][c] = { type: fType, rot: Math.floor(Math.random() * 4), isPowered: false, isPath: false };
                    }
                }
            }

            renderBoard();
            checkPowerConnection();
            isAnimating = false; 
        }

        // DFS 路徑生成
        function generateRandomPath(size, sr, sc, er, ec) {
            let path = [];
            let visited = Array(size).fill(false).map(() => Array(size).fill(false));
            
            function dfs(r, c) {
                if (r < 0 || r >= size || c < 0 || c >= size || visited[r][c]) return false;
                path.push({r, c});
                visited[r][c] = true;
                
                if (r === er && c === ec) return true;

                let dirs = [[-1,0], [0,1], [1,0], [0,-1]];
                dirs.sort(() => Math.random() - 0.5);

                for (let d of dirs) {
                    if (dfs(r + d[0], c + d[1])) return true;
                }
                
                path.pop();
                visited[r][c] = false;
                return false;
            }

            path.push({r: sr, c: sc});
            visited[sr][sc] = true;
            if (!dfs(sr, sc + 1)) {
                path = [];
                for(let i=0; i<size; i++) path.push({r:sr, c:i});
            }
            return path;
        }

        // 渲染電路板 DOM
        function renderBoard() {
            boardEl.innerHTML = '';
            for (let r = 0; r < currentGridSize; r++) {
                for (let c = 0; c < currentGridSize; c++) {
                    const tile = board[r][c];
                    const div = document.createElement('div');
                    div.id = `tile-${r}-${c}`;
                    div.className = `w-full h-full bg-slate-900 rounded-[3px] md:rounded-md cursor-pointer tile flex items-center justify-center border border-slate-800 hover:bg-slate-800 overflow-hidden`;
                    
                    div.onclick = () => rotateTile(r, c);
                    
                    let svgStr = "";
                    if (tile.type === TILE_STRAIGHT) svgStr = SVG_STRAIGHT;
                    else if (tile.type === TILE_CORNER) svgStr = SVG_CORNER;
                    else if (tile.type === TILE_T_SHAPE) svgStr = SVG_T_SHAPE;
                    else if (tile.type === TILE_CROSS) svgStr = SVG_CROSS;

                    svgStr = svgStr.replace('{{STATE_CLASS}}', 'wire-off');
                    div.innerHTML = svgStr;
                    div.style.transform = `rotate(${tile.rot * 90}deg)`;
                    boardEl.appendChild(div);
                }
            }
        }

        // ==========================================
        // 6. 互動與通電判定邏輯
        // ==========================================
        
        function rotateTile(r, c) {
            if (!isPlaying || isAnimating) return;
            levelClicks++;
            
            board[r][c].rot = (board[r][c].rot + 1) % 4;
            const el = document.getElementById(`tile-${r}-${c}`);
            el.style.transform = `rotate(${board[r][c].rot * 90}deg)`;
            
            checkPowerConnection();
        }

        // 取得方塊目前開放的方向
        function getOutputs(tile) {
            if (tile.type === TILE_STRAIGHT) return (tile.rot % 2 === 0) ? [0, 2] : [1, 3];
            if (tile.type === TILE_CORNER) return [tile.rot, (tile.rot + 1) % 4];
            if (tile.type === TILE_T_SHAPE) return [tile.rot, (tile.rot + 1) % 4, (tile.rot + 2) % 4];
            if (tile.type === TILE_CROSS) return [0, 1, 2, 3];
            return [];
        }

        // BFS 電流擴散模擬
        function checkPowerConnection() {
            for (let r = 0; r < currentGridSize; r++) {
                for (let c = 0; c < currentGridSize; c++) board[r][c].isPowered = false;
            }

            let queue = [{r: startRow, c: startCol, incomingDir: DIR_LEFT}];
            let levelComplete = false;

            while (queue.length > 0) {
                let curr = queue.shift();
                let tile = board[curr.r][curr.c];
                let outputs = getOutputs(tile);

                if (outputs.includes(curr.incomingDir) && !tile.isPowered) {
                    tile.isPowered = true;
                    let outDirs = outputs.filter(d => d !== curr.incomingDir);
                    
                    for (let outDir of outDirs) {
                        let nr = curr.r, nc = curr.c;
                        if (outDir === DIR_TOP) nr--;
                        else if (outDir === DIR_RIGHT) nc++;
                        else if (outDir === DIR_BOTTOM) nr++;
                        else if (outDir === DIR_LEFT) nc--;

                        if (curr.r === endRow && curr.c === endCol && outDir === DIR_RIGHT) {
                            levelComplete = true;
                        } 
                        else if (nr >= 0 && nr < currentGridSize && nc >= 0 && nc < currentGridSize) {
                            queue.push({r: nr, c: nc, incomingDir: (outDir + 2) % 4});
                        }
                    }
                }
            }

            updateDomStyles(levelComplete);
            
            if (levelComplete) {
                isAnimating = true; 
                handleLevelComplete();
            }
        }

        function updateDomStyles(isComplete) {
            for (let r = 0; r < currentGridSize; r++) {
                for (let c = 0; c < currentGridSize; c++) {
                    const tile = board[r][c];
                    const el = document.getElementById(`tile-${r}-${c}`);
                    const pathEl = el.querySelector('.wire-base');
                    
                    pathEl.classList.remove('wire-off', 'wire-on', 'wire-finish');
                    el.classList.remove('neon-glow', 'neon-success', 'border-cyan-500', 'border-emerald-500', 'border-slate-800');
                    
                    if (isComplete && tile.isPowered) {
                        pathEl.classList.add('wire-finish');
                        el.classList.add('neon-success', 'border-emerald-500');
                    } else if (tile.isPowered) {
                        pathEl.classList.add('wire-on');
                        el.classList.add('neon-glow', 'border-cyan-500');
                    } else {
                        pathEl.classList.add('wire-off');
                        el.classList.add('border-slate-800');
                    }
                }
            }
        }

        // ==========================================
        // 7. 過關結算與特效
        // ==========================================
        
        function handleLevelComplete() {
            const icon = document.getElementById('applianceIcon');
            const box = document.getElementById('applianceBox');
            const text = document.getElementById('applianceText');
            const line = document.getElementById('endLine');

            line.className = "absolute right-1/2 top-1/2 -translate-y-1/2 w-[200%] h-[10px] sm:h-[14px] md:h-[22px] bg-emerald-500 z-0 pointer-events-none transition-colors duration-300";
            box.className = "bg-cyber-panel border sm:border-2 border-emerald-500 rounded-md sm:rounded-lg p-1 sm:p-2 text-center w-full relative z-10 transition-all duration-300 flex flex-col items-center neon-success shadow-lg";
            icon.className = `fa-solid ${currentAppliance.icon} text-emerald-400 text-xl sm:text-2xl md:text-4xl mb-0.5 md:mb-2 animate-bounce`;
            
            if(currentAppliance.icon === 'fa-fan') {
                icon.classList.add('animate-spin');
                icon.classList.remove('animate-bounce');
            }
            
            text.innerHTML = `${currentAppliance.name}<br>ON`;
            text.className = "text-[8px] sm:text-[10px] md:text-xs font-bold text-emerald-400 leading-tight";

            // 分數計算
            let timeSpent = Math.max(1, Math.floor((Date.now() - levelStartTime) / 1000));
            let baseScore = level * 100;
            let timeBonus = Math.max(0, 30 - timeSpent) * 10 * level;
            let clickTarget = currentGridSize * currentGridSize * 3; 
            let clickBonus = Math.max(0, clickTarget - levelClicks) * 5 * level;
            let earnedScore = Math.floor(baseScore + timeBonus + clickBonus);
            
            score += earnedScore;
            showFloatingScore(earnedScore);

            confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 }, colors: ['#0ea5e9', '#10b981', '#ffffff', '#f59e0b'] });

            timeLeft += 10; 
            level++;
            updateUI();

            setTimeout(() => { nextLevel(); }, 1500);
        }

        function showFloatingScore(earned) {
            const floating = document.createElement('div');
            floating.innerHTML = `<span class="text-xl md:text-2xl mr-1">+</span>${earned}`;
            floating.className = 'absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 text-4xl md:text-6xl font-black text-amber-400 drop-shadow-[0_0_15px_rgba(245,158,11,0.8)] z-50 pointer-events-none animate-float-up';
            document.querySelector('main').appendChild(floating);
            setTimeout(() => { floating.remove(); }, 1200);
        }

        function resetApplianceUI() {
            const icon = document.getElementById('applianceIcon');
            const box = document.getElementById('applianceBox');
            const text = document.getElementById('applianceText');
            const line = document.getElementById('endLine');

            icon.className = `fa-solid ${currentAppliance.icon} text-slate-500 text-xl sm:text-2xl md:text-4xl mb-0.5 md:mb-2 transition-all duration-300`;
            box.className = "bg-cyber-panel border sm:border-2 border-slate-700 rounded-md sm:rounded-lg p-1 sm:p-2 text-center w-full relative z-10 transition-all duration-300 flex flex-col items-center shadow-lg";
            text.innerHTML = `${currentAppliance.name}<br>OFF`;
            text.className = "text-[8px] sm:text-[10px] md:text-xs font-bold text-slate-500 leading-tight transition-colors duration-300";
            line.className = "absolute right-1/2 top-1/2 -translate-y-1/2 w-[200%] h-[10px] sm:h-[14px] md:h-[22px] bg-cyber-line z-0 pointer-events-none transition-colors duration-300";
        }

        // ==========================================
        // 8. 內建排行榜與 API 介接
        // ==========================================
        
        // 請確保您的 GAS 後端有允許跨域的 Header
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyniTBbW9ySb-UDCFFBVfeM9CE_PzlGu4TiarBnXwqTPH6SYjTsUSVpd-siFmq2iX3-/exec"; 
        
        let cachedLeaderboardData = null; 
        let isFetchingLeaderboard = false;
        let isPausedByModal = false;

        function openLeaderboardModal() {
            // 打開視窗時暫停遊戲時間
            if (isPlaying) {
                isPlaying = false; 
                isPausedByModal = true;
            }
            document.getElementById('overlay-leaderboard').classList.remove('hidden');
            fetchModalLeaderboard(false); 
        }

        function closeLeaderboardModal() {
            document.getElementById('overlay-leaderboard').classList.add('hidden');
            // 恢復計時器
            if (isPausedByModal) {
                isPlaying = true; 
                isPausedByModal = false;
            }
        }

        function fetchModalLeaderboard(forceRefresh = false) {
            const tbody = document.getElementById('modal-leaderboard-body');
            const syncStatus = document.getElementById('modal-sync-status');
            const refreshIcon = document.getElementById('icon-refresh');
            const refreshBtn = document.getElementById('btn-refresh-board');
            
            // 快取機制：非強制且已有資料時，0 毫秒瞬間顯示
            if (cachedLeaderboardData && !forceRefresh) {
                renderModalBoard(cachedLeaderboardData);
            } else if (!cachedLeaderboardData) {
                tbody.innerHTML = `<tr><td colspan="4" class="text-center py-8 text-slate-500 animate-pulse">${i18n[currentLang].loading}</td></tr>`;
            }

            if (isFetchingLeaderboard) return;
            isFetchingLeaderboard = true;

            // UI 狀態：同步中
            if (refreshIcon) refreshIcon.classList.add('fa-spin');
            if (refreshBtn) refreshBtn.disabled = true;
            if (syncStatus) syncStatus.innerHTML = `<span class="w-1.5 h-1.5 bg-amber-400 rounded-full animate-pulse"></span> <span class="text-amber-400/80">${i18n[currentLang].syncing}</span>`;

            if (GAS_WEB_APP_URL && GAS_WEB_APP_URL !== "請在此填入您的_GAS_網址") {
                fetch(GAS_WEB_APP_URL)
                    .then(response => response.json())
                    .then(records => {
                        cachedLeaderboardData = records; 
                        const modal = document.getElementById('overlay-leaderboard');
                        if (modal && !modal.classList.contains('hidden')) {
                            renderModalBoard(records);
                        }
                    })
                    .catch(error => {
                        console.error("抓取排行榜失敗:", error);
                        if (!cachedLeaderboardData) {
                            tbody.innerHTML = `<tr><td colspan="4" class="text-center py-8 text-rose-500">${i18n[currentLang].connectError}</td></tr>`;
                        }
                    })
                    .finally(() => {
                        isFetchingLeaderboard = false;
                        // UI 狀態：已更新
                        if (refreshIcon) refreshIcon.classList.remove('fa-spin');
                        if (refreshBtn) refreshBtn.disabled = false;
                        if (syncStatus) {
                            syncStatus.innerHTML = `<span class="w-1.5 h-1.5 bg-emerald-500 rounded-full"></span> <span class="text-emerald-500/80">${i18n[currentLang].updated}</span>`;
                            setTimeout(() => { if (syncStatus) syncStatus.innerHTML = ''; }, 2000);
                        }
                    });
            } else {
                // 本機假資料測試
                setTimeout(() => {
                    const mockData = [
                        { name: '114310001', score: 15400, level: 6 },
                        { name: '114310002', score: 12300, level: 5 }
                    ];
                    cachedLeaderboardData = mockData;
                    renderModalBoard(mockData);
                    isFetchingLeaderboard = false;
                    
                    if (refreshIcon) refreshIcon.classList.remove('fa-spin');
                    if (refreshBtn) refreshBtn.disabled = false;
                    if (syncStatus) syncStatus.innerHTML = `<span class="w-1.5 h-1.5 bg-emerald-500 rounded-full"></span> <span class="text-emerald-500/80">${i18n[currentLang].updated}</span>`;
                }, 800);
            }
        }

        function renderModalBoard(records) {
            const tbody = document.getElementById('modal-leaderboard-body');
            tbody.innerHTML = '';

            if (!records || records.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="text-center py-8 text-slate-500">尚無紀錄</td></tr>`;
                return;
            }

            records.forEach((record, index) => {
                const tr = document.createElement('tr');
                tr.className = "border-b border-slate-800/50 hover:bg-slate-900/50 transition-colors";
                
                let rankClass = "text-slate-400";
                if (index === 0) rankClass = "text-amber-400 font-bold";
                else if (index === 1) rankClass = "text-slate-200 font-bold";
                else if (index === 2) rankClass = "text-amber-600 font-bold";

                // 使用 escapeHTML 防止 XSS
                tr.innerHTML = `
                    <td class="py-2.5 md:py-3 px-2 md:px-3 font-mono text-[11px] md:text-sm ${rankClass}">#${index + 1}</td>
                    <td class="py-2.5 md:py-3 px-2 md:px-3 text-slate-200 text-[11px] md:text-sm font-bold truncate max-w-[80px] sm:max-w-[120px] md:max-w-[200px]" title="${escapeHTML(record.name)}">${escapeHTML(record.name)}</td>
                    <td class="py-2.5 md:py-3 px-2 md:px-3 text-right font-mono text-cyan-400 font-bold text-xs md:text-base">${record.score.toLocaleString()}</td>
                    <td class="py-2.5 md:py-3 px-2 md:px-3 text-center font-mono"><span class="bg-slate-800 px-1.5 py-0.5 rounded text-[10px] md:text-xs text-slate-300 border border-slate-700">Lv.${record.level}</span></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function submitScore() {
            const nameInput = document.getElementById('playerName');
            const name = nameInput.value.trim() || (currentLang === 'zh' ? '無名維修員' : 'Unknown Fixer');
            const btn = document.getElementById('btn-submit-score');
            
            btn.innerText = i18n[currentLang].btnSubmitting;
            btn.disabled = true;
            btn.classList.add('opacity-75');

            if (GAS_WEB_APP_URL !== "請在此填入您的_GAS_網址" && GAS_WEB_APP_URL !== "") {
                const formData = new URLSearchParams();
                formData.append('name', name);
                formData.append('score', score);
                formData.append('level', level);

                fetch(GAS_WEB_APP_URL, {
                    method: 'POST',
                    body: formData,
                    mode: 'no-cors' // 防止跨域報錯
                }).then(() => {
                    alertCustom(i18n[currentLang].toastSuccess);
                    btn.innerText = i18n[currentLang].btnSubmitted;
                    setTimeout(() => fetchModalLeaderboard(true), 1500); // 上傳後強制更新
                }).catch(e => {
                    alertCustom(i18n[currentLang].toastFail);
                    btn.innerText = i18n[currentLang].submitBtn;
                    btn.disabled = false;
                    btn.classList.remove('opacity-75');
                });
            } else {
                alertCustom(i18n[currentLang].toastTest);
                btn.innerText = i18n[currentLang].btnTestDone;
            }
        }

        // ==========================================
        // 9. 啟動與預載機制
        // ==========================================
        
        applyLanguage();
        initGame();
        document.getElementById('current-year').textContent = new Date().getFullYear();

        // 預先載入機制：網頁打開 1.5 秒後，背景抓取排行榜資料
        setTimeout(() => {
            fetchModalLeaderboard(false);
        }, 1500);

    </script>
